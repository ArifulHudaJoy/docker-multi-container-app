services:
  writer:
    build: ./writer
    ports:
      - "8000:8000"
    volumes:
      - data:/shared
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 10s
      timeout: 3s
      retries: 3

  reader:
    build: ./reader
    ports:
      - "8001:8001"
    volumes:
      - data:/shared
    depends_on:
      writer:
        condition: service_healthy
    restart: always

volumes:
  data:
